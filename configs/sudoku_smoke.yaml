model:
  model_type: trm
  vocab_size: 11
  num_classes: 11
  max_seq_len: 81
  d_model: 64
  n_heads: 4
  dropout: 0.1
  n_layers: 2
  dim_ff_mult: 4
  h_cycles: 2
  l_cycles: 4
  h_layers: 1
  l_layers: 1
  trm_steps: 8
  trm_layers: 2
  n_explorers: 4
  d_explorer_mult: 0.5
  pi_layers: 1
  library_size: 64
  rag_library_size: 64
  mlp_library_mult: 4
  lg_steps: 2
  use_library: true
  forced_library: false
  hard_library_gate: true
  gate_threshold: 0.5
  straight_through_gate: true
  use_diversity_loss: true
task:
  task_name: puzzle_npy
  seq_len: 81
  modulus: 11
  n_train: 1024
  n_val: 512
  vocab_size: 11
  seed: 0
  dataset_path: data/sudoku-extreme-1k-aug-1000
  puzzle_set: all
train:
  batch_size: 64
  epochs: 1
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  retrieval_cost: 0.01
  diversity_weight: 0.01
  entropy_weight: 0.0
  seed: 0
  out_dir: runs/sudoku_smoke
