model:
  model_type: lg_prm
  vocab_size: 11
  num_classes: 11
  max_seq_len: 81
  d_model: 248
  n_heads: 8
  dropout: 0.1
  n_layers: 4
  dim_ff_mult: 4
  h_cycles: 3
  l_cycles: 6
  h_layers: 0
  l_layers: 2
  trm_steps: 4
