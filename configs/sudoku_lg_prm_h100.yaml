  eqr_halt_max_steps: 16
  halt_exploration_prob: 0.1
  q_halt_weight: 0.5
  lora_scale: 0.05
  lora_max: 0.1
task:
  task_name: puzzle_npy
  seq_len: 81
  modulus: 11
  n_train: 1001000
  n_val: 422786
