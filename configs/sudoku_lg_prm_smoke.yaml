model:
  model_type: lg_prm
  vocab_size: 11
  num_classes: 11
  max_seq_len: 81
  d_model: 32
  n_heads: 4
  dropout: 0.1
  n_layers: 2
  dim_ff_mult: 2
  h_cycles: 1
  l_cycles: 2
  h_layers: 1
  l_layers: 1
  trm_steps: 2
  trm_layers: 1
  n_explorers: 2
  d_explorer_mult: 0.5
  pi_layers: 1
  library_size: 16
  rag_library_size: 16
  mlp_library_mult: 2
  lg_steps: 1
  use_library: true
  forced_library: false
  hard_library_gate: true
  gate_threshold: 0.5
  straight_through_gate: true
  use_diversity_loss: true
task:
  task_name: puzzle_npy
  seq_len: 81
  modulus: 11
  n_train: 512
  n_val: 256
  vocab_size: 11
  seed: 0
  dataset_path: data/sudoku-extreme-1k-aug-1000
  puzzle_set: all
train:
  batch_size: 32
  epochs: 1
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  retrieval_cost: 0.01
  diversity_weight: 0.01
  entropy_weight: 0.0
  seed: 0
  out_dir: runs/sudoku_lg_prm_smoke
