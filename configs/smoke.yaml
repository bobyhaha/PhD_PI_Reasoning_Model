model:
  model_type: lg_prm
  vocab_size: 128
  num_classes: 17
  max_seq_len: 15
  d_model: 16
  n_heads: 1
  dropout: 0.1
  n_layers: 2
  dim_ff_mult: 2
  h_cycles: 1
  l_cycles: 2
  h_layers: 1
  l_layers: 1
  trm_steps: 2
  trm_layers: 1
  n_explorers: 1
  d_explorer_mult: 0.5
  pi_layers: 1
  library_size: 8
  rag_library_size: 8
  mlp_library_mult: 2
  lg_steps: 1
  use_library: true
  forced_library: false
  hard_library_gate: true
  gate_threshold: 0.5
  straight_through_gate: true
  use_diversity_loss: true
task:
  task_name: mod_expr
  seq_len: 15
  modulus: 17
  n_train: 8
  n_val: 8
  vocab_size: 128
  seed: 0
  dataset_path: ''
  puzzle_set: ''
train:
  batch_size: 8
  epochs: 1
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  retrieval_cost: 0.01
  diversity_weight: 0.01
  entropy_weight: 0.0
  seed: 0
  out_dir: runs/smoke
